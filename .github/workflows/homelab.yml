name: CI / Homelab CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wapphub-demo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: |
          docker compose config --quiet
          test -f Dockerfile
          grep -q 'location = /health' nginx.conf
          bash -n .github/scripts/deploy.sh
      - name: Validate interface and modules
        run: |
          node --test tests/*.test.mjs
          for file in src/*.js; do node --input-type=module --check < "$file"; done
      - name: Build image
        run: docker build --pull -t wapphub-demo:ci .
      - name: Smoke test
        run: |
          docker run -d --rm --name wapphub-demo-ci -p 127.0.0.1:18280:80 wapphub-demo:ci
          trap 'docker rm -f wapphub-demo-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18280/health | grep -qx ok; then
              curl -fsS http://127.0.0.1:18280/ >/dev/null
              curl -fsS http://127.0.0.1:18280/dashboard | grep -q 'id="app"'
              curl -fsS http://127.0.0.1:18280/profile | grep -q 'id="app"'
              curl -fsS http://127.0.0.1:18280/inbox/mariana/details | grep -q 'id="app"'
              curl -fsS http://127.0.0.1:18280/settings/appearance | grep -q 'id="app"'
              curl -fsS 'http://127.0.0.1:18280/media?conversation=mariana&type=video' | grep -q 'id="app"'
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18280/src/missing-module.js)" = "404"
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18280/assets/missing-video.mp4)" = "404"
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18280/assets/missing-report.pdf)" = "404"
              curl -fsS http://127.0.0.1:18280/inbox/unavailable/details | grep -q 'id="app"'
              curl -fsS http://127.0.0.1:18280/src/main.js | grep -q 'setupChannelPicker'
              curl -fsS http://127.0.0.1:18280/src/channel-filter.mjs | grep -q 'normalizeSelection'
              curl -fsS http://127.0.0.1:18280/src/role-rules.mjs | grep -q 'eligibleConversations'
              curl -fsS http://127.0.0.1:18280/src/styles.css | grep -q 'channel-filter-popover'
              curl -fsS http://127.0.0.1:18280/src/media-catalog.mjs | grep -q 'mediaEntries'
              curl -fsS http://127.0.0.1:18280/src/channel-identity.mjs | grep -q 'inferChannelPlatform'
              curl -fsS http://127.0.0.1:18280/src/channel-identity-ui.js | grep -q 'createOriginBadge'
              curl -fsS http://127.0.0.1:18280/ | grep -q 'id="detail-provider"'
              curl -fsS http://127.0.0.1:18280/src/media-player.js | grep -q 'createMediaPlayer'
              curl -fsS http://127.0.0.1:18280/src/media-preferences.mjs | grep -q 'resolveMediaBlur'
              curl -fsS http://127.0.0.1:18280/src/media-blur.js | grep -q 'attachMediaBlur'
              curl -fsS http://127.0.0.1:18280/src/styles.css | grep -q 'data-animations'
              curl -fsS http://127.0.0.1:18280/assets/equipment.svg | grep -q '<svg'
              curl -fsS http://127.0.0.1:18280/assets/receipt.svg | grep -q '<svg'
              curl -fsS http://127.0.0.1:18280/assets/video-poster.svg | grep -q '<svg'
              curl -fsSI http://127.0.0.1:18280/src/channel-filter.mjs | grep -qi '^content-type: application/javascript'
              exit 0
            fi
            sleep 2
          done
          docker logs wapphub-demo-ci
          exit 1
      - name: Resolve immutable image ref
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          docker tag wapphub-demo:ci "${{ steps.image.outputs.ref }}"
          docker push "${{ steps.image.outputs.ref }}"
  request-central-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtain short-lived central dispatch credential
        id: auth
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HOMELAB_APP_ID }}
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          owner: uillaneduardo
          repositories: homelab-deploy
          permission-contents: write
      - name: Request central deployment
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          gh api -X POST repos/uillaneduardo/homelab-deploy/dispatches \
            -f event_type=wapphub-demo-published \
            -f client_payload[image_sha]="$IMAGE_SHA"
