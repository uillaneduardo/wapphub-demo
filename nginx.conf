server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 location = /health { access_log off; default_type text/plain; return 200 "ok"; }
 location = /index.html { add_header Cache-Control "no-store" always; }
 location / { try_files $uri $uri/ /index.html; }
 location ~* \\.mjs$ {
  types { application/javascript mjs; }
  try_files $uri =404;
  expires -1;
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header X-Content-Type-Options nosniff always;
 }
 location ~* \\.(css|js|svg|png|woff2)$ { try_files $uri =404; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: https://interactive-examples.mdn.mozilla.net; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}