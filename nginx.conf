server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 location = /health { access_log off; default_type text/plain; return 200 "ok"; }
 location / { try_files $uri $uri/ =404; }
 location ~* \.(css|js|svg|png|woff2)$ { expires 1h; add_header Cache-Control "public"; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}