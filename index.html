<!doctype html>
<html lang="pt-BR">
<head>
<base href="/">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa"><meta name="description" content="WappHub — atendimento multicanal">
<title>Atendimento · WappHub</title>
<link rel="stylesheet" href="./src/styles.css?v=chat-jump-1&voice-2&audio-progress-1&composer-contrast-1&unread-accent-1&composer-surface-1&white-desktop-1">
<script type="module" src="./src/main.js?v=chat-jump-1&voice-2&load50-1&controls-1"></script>
</head>
<body>
<div id="app" class="shell">
  <nav class="rail" aria-label="Navegação principal">
    <a class="brand" href="/inbox" data-route aria-label="WappHub início">W<span>.</span></a>
    <div class="rail-links">
      <button class="icon-button active" data-nav="atendimento" aria-label="Atendimento" title="Atendimento"><svg><use href="#i-message"/></svg></button>
      <button class="icon-button" data-nav="visao-geral" aria-label="Visão geral" title="Visão geral"><svg><use href="#i-grid"/></svg></button>
      <button class="icon-button" data-nav="contatos" aria-label="Contatos" title="Contatos"><svg><use href="#i-users"/></svg></button>
      <button class="icon-button" data-nav="midias" aria-label="Mídias" title="Mídias"><svg><use href="#i-gallery"/></svg></button>
    </div>
    <div class="rail-bottom">
      <button class="icon-button" data-nav="configuracoes" aria-label="Configurações" title="Configurações"><svg><use href="#i-settings"/></svg></button>
      <button class="icon-button" id="theme-toggle" aria-label="Alternar tema" title="Alternar tema"><svg><use href="#i-moon"/></svg></button>
      <button class="avatar user-avatar" id="profile-button" aria-label="Menu do usuário">UE</button>
    </div>
  </nav>
  <aside class="inbox" id="inbox">
    <header class="inbox-header">
      <div class="inbox-topline">
        <span class="eyebrow">Caixa de entrada</span>
        <div class="inbox-channel-control">
          <button type="button" id="channel-filter-trigger" class="icon-button channel-filter-trigger" aria-label="Filtrar canais" aria-haspopup="dialog" aria-expanded="false" aria-controls="channel-filter-popover" title="Filtrar canais">
            <svg aria-hidden="true"><use href="#i-layers"/></svg>
            <span id="channel-filter-badge" class="channel-filter-badge" hidden></span>
          </button>
          <section id="channel-filter-popover" class="channel-filter-popover" role="dialog" aria-label="Selecionar canais de mensagens" hidden>
            <div class="channel-filter-head">
              <strong>Selecionar canais</strong>
              <span id="channel-filter-summary" class="channel-filter-summary"></span>
            </div>
            <div id="channel-filter-options" class="channel-filter-options"></div>
          </section>
        </div>
      </div>
      <div class="heading"><h1>Conversas <span id="conversation-count" class="count"></span></h1></div>
      <label class="search"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="Buscar conversas..." aria-label="Buscar conversas"><kbd>⌘ K</kbd></label>
      <div class="filters" role="group" aria-label="Filtrar conversas"><button class="chip selected" data-filter="all" aria-pressed="true">Todas</button><button class="chip" data-filter="unread" aria-pressed="false">Não lidas</button><button class="chip" data-filter="mine" aria-pressed="false">Minhas</button></div>
    </header>
    <div class="list" id="conversation-list" role="list" aria-label="Conversas"></div>
  </aside>
  <main class="workspace" id="workspace">
    <header class="chat-header">
      <button class="icon-button mobile-back" id="back-button" aria-label="Voltar às conversas"><svg><use href="#i-back"/></svg></button>
      <div class="avatar" id="chat-avatar" aria-hidden="true">MC</div>
      <div class="chat-heading"><strong id="chat-title">Mariana Costa</strong><div class="chat-origin-line"><span id="chat-origin"></span><small id="chat-subtitle">Atendimento em andamento</small></div></div>
      <div class="header-actions">
        <button class="icon-button" id="find-messages" aria-label="Buscar mensagens" title="Buscar mensagens"><svg><use href="#i-search"/></svg></button>
        <button class="icon-button" id="details-toggle" aria-label="Mostrar detalhes" aria-expanded="false" title="Detalhes"><svg><use href="#i-sidebar"/></svg></button>
        <button class="icon-button" id="chat-menu" aria-label="Opções da conversa" title="Opções"><svg><use href="#i-more"/></svg></button>
      </div>
    </header>
    <div id="message-search" class="message-search" role="search" hidden>
      <label class="message-search-field" for="message-search-input">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
        <input id="message-search-input" type="search" placeholder="Buscar nesta conversa..." autocomplete="off" aria-label="Buscar no histórico da conversa">
      </label>
      <span id="message-search-count" class="message-search-count" role="status" aria-live="polite"></span>
      <button id="message-search-clear" class="message-search-button" type="button" hidden>Limpar</button>
      <button id="message-search-close" class="icon-button message-search-close" type="button" aria-label="Fechar busca" title="Fechar busca"><svg><use href="#i-close"/></svg></button>
    </div>
    <div id="status-banner" class="status-banner" hidden role="status"></div>
    <section class="messages" id="messages" aria-label="Histórico da conversa" aria-live="polite"></section>
    <button class="chat-jump-latest" id="chat-jump-latest" type="button"
      aria-label="Ir para a mensagem mais recente" title="Ir para a última mensagem"
      aria-controls="messages" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 4v15m-6-6 6 6 6-6" />
      </svg>
    </button>
    <form class="composer" id="composer">
      <div class="composer-box">
        <button type="button" class="icon-button" id="attach-button" aria-label="Anexar arquivo" title="Anexar"><svg><use href="#i-plus"/></svg></button>
        <textarea id="message-input" rows="1" placeholder="Escreva uma mensagem..." aria-label="Escreva uma mensagem"></textarea>
        <button type="button" class="icon-button" id="emoji-button" aria-label="Inserir emoji" title="Emoji"><svg><use href="#i-smile"/></svg></button>
        <button type="button" class="icon-button" id="voice-start" aria-label="Gravar mensagem de voz" title="Gravar áudio"><svg><use href="#i-mic"/></svg></button>
        <button class="send-button" type="submit" aria-label="Enviar mensagem"><svg><use href="#i-send"/></svg></button>
        <div id="voice-composer" class="voice-composer" hidden>
          <div id="voice-recording" class="voice-recording" hidden>
            <button type="button" id="voice-pause" class="icon-button voice-control" aria-label="Pausar gravação" title="Pausar"><svg><use href="#i-pause"/></svg></button>
            <button type="button" id="voice-discard" class="icon-button voice-trash" aria-label="Cancelar e descartar gravação" title="Descartar"><svg><use href="#i-trash"/></svg></button>
            <span class="voice-state"><span class="voice-dot" aria-hidden="true"></span><span id="voice-record-status">Gravando áudio</span></span>
            <span id="voice-elapsed" class="voice-time" aria-label="Tempo de gravação">00:00</span>
            <canvas id="voice-wave" class="voice-wave" width="180" height="28" aria-label="Intensidade do microfone durante a gravação" role="img"></canvas>
            <div id="voice-paused-player" class="voice-paused-player" hidden>
              <button type="button" id="voice-play" class="icon-button voice-listen" aria-label="Ouvir trecho gravado" title="Ouvir"><svg><use href="#i-play"/></svg></button>
              <input type="range" id="voice-progress" min="0" max="1" step="0.1" value="0" aria-label="Navegar no áudio pausado">
              <span id="voice-preview-time" class="voice-preview-time">00:00 / 00:00</span>
            </div>
            <button type="button" id="voice-send" class="send-button voice-send" aria-label="Finalizar e enviar áudio" title="Finalizar e enviar áudio"><svg><use href="#i-send"/></svg></button>
            <audio id="voice-audio" preload="metadata"></audio>
          </div>
          <span id="voice-live-status" class="sr-only" aria-live="polite"></span>
        </div>
      </div>
      <div class="composer-foot"><span>Enter para enviar · Shift+Enter para nova linha</span></div>
    </form>
  </main>
  <aside class="details" id="details" aria-label="Detalhes da conversa" hidden>
    <div class="details-head"><strong>Detalhes</strong><button class="icon-button" id="details-close" aria-label="Fechar detalhes"><svg><use href="#i-close"/></svg></button></div>
    <div class="contact-card"><div class="avatar large" id="detail-avatar">MC</div><strong id="detail-name">Mariana Costa</strong><span id="detail-phone" class="muted"></span></div>
    <div class="detail-section"><span class="eyebrow">Atendimento</span><div class="detail-row"><span>Situação</span><strong id="detail-status"></strong></div><div class="detail-row"><span>Responsável</span><strong id="detail-agent"></strong></div></div>
    <section class="detail-section origin-detail-section" aria-label="Origem da conversa"><span class="eyebrow">Origem da conversa</span><div class="detail-row"><span>Plataforma</span><strong id="detail-platform"></strong></div><div class="detail-row"><span>Canal</span><strong id="detail-channel"></strong></div><div class="detail-row"><span>Provider</span><strong id="detail-provider"></strong></div><div class="detail-row"><span>Conexão</span><strong id="detail-connection"></strong></div></section>
    <section id="detail-media" class="detail-media" aria-label="Mídias desta conversa"></section>
  </aside>
</div>
<div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><symbol id="i-origin-whatsapp" viewBox="0 0 24 24"><path d="M20 11.8a8 8 0 0 1-11.7 7.1L4 20l1.1-4.3A8 8 0 1 1 20 11.8Z"/><path d="m9 9 1.2 1.1-.7 1.2a6 6 0 0 0 3.3 3.2l1.2-.6 1.1 1.1"/></symbol>
<symbol id="i-origin-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.7 5.5 3.7 9s-1.2 6.5-3.7 9C9.5 18.5 8.3 15.5 8.3 12S9.5 5.5 12 3Z"/></symbol>
<symbol id="i-origin-internal" viewBox="0 0 24 24"><path d="M4 6h16v11H9l-5 3V6Z"/><path d="M8 10h8M8 13h6"/></symbol>
<symbol id="i-origin-unknown" viewBox="0 0 24 24"><path d="M8 9V5h8v4M8 15v4h8v-4M5 9h14v6H5V9Z"/><path d="M9 12h6"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24">
  <path d="M14 17H5" />
  <path d="M19 7h-9" />
  <circle cx="17" cy="17" r="3" />
  <circle cx="7" cy="7" r="3" />
</symbol>
<symbol id="i-message" viewBox="0 0 24 24">
  <path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z" />
</symbol>
<symbol id="i-grid" viewBox="0 0 24 24">
  <rect width="7" height="9" x="3" y="3" rx="1" />
  <rect width="7" height="5" x="14" y="3" rx="1" />
  <rect width="7" height="9" x="14" y="12" rx="1" />
  <rect width="7" height="5" x="3" y="16" rx="1" />
</symbol>
<symbol id="i-users" viewBox="0 0 24 24">
  <path d="M18 21a8 8 0 0 0-16 0" />
  <circle cx="10" cy="8" r="5" />
  <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" />
</symbol>
<symbol id="i-moon" viewBox="0 0 24 24">
  <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
</symbol>
<symbol id="i-search" viewBox="0 0 24 24">
  <path d="m21 21-4.34-4.34" />
  <circle cx="11" cy="11" r="8" />
</symbol>
<symbol id="i-more" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="1" />
  <circle cx="19" cy="12" r="1" />
  <circle cx="5" cy="12" r="1" />
</symbol>
<symbol id="i-back" viewBox="0 0 24 24">
  <path d="m15 18-6-6 6-6" />
</symbol>
<symbol id="i-sidebar" viewBox="0 0 24 24">
  <rect width="18" height="18" x="3" y="3" rx="2" />
  <path d="M15 3v18" />
</symbol>
<symbol id="i-plus" viewBox="0 0 24 24">
  <path d="M5 12h14" />
  <path d="M12 5v14" />
</symbol>
<symbol id="i-send" viewBox="0 0 24 24">
  <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
  <path d="m21.854 2.147-10.94 10.939" />
</symbol>
<symbol id="i-close" viewBox="0 0 24 24">
  <path d="M18 6 6 18" />
  <path d="m6 6 12 12" />
</symbol>
<symbol id="i-gallery" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 5-5 3 3 4-4 6 6"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.7-6.8 10-6.8S22 12 22 12s-3.7 6.8-10 6.8S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></symbol>
<symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3 21 21M10.7 5.3A11.3 11.3 0 0 1 12 5.2c6.3 0 10 6.8 10 6.8a17 17 0 0 1-3.2 3.9M6.6 6.6A16.2 16.2 0 0 0 2 12s3.7 6.8 10 6.8a11.3 11.3 0 0 0 4.6-1M10.4 10.4a2.7 2.7 0 0 0 3.2 3.2"/></symbol>
<symbol id="i-reply-swipe" viewBox="0 0 24 24"><path d="m9 10-5 5 5 5"/><path d="M4 15V9a4 4 0 0 1 4-4h7a5 5 0 0 1 5 5v2"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></symbol><symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></symbol></svg>
</body>
</html>
